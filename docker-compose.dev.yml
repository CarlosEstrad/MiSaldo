# MiSaldo — local development environment (spec 04, R8).
#
#   docker compose -f docker-compose.dev.yml up -d
#
# Services, all published on 127.0.0.1 only (never on the network):
#   postgres  PostgreSQL 17 (same image as the tests), data in a volume.
#             misaldo_admin applies the migrations; the API connects as
#             misaldo_app, which does NOT bypass Row Level Security.
#   mailpit   Catches every email the API sends. Web UI on port 8025.
#   pgadmin   Database UI on port 5050, with the admin connection registered.
#
# The passwords come from the local .env (ignored by git; see .env.example),
# never from this file. Compose reads .env from this folder on its own.
#
# `docker compose down` keeps the data; `docker compose down -v` DELETES it.

name: misaldo-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: misaldo
      POSTGRES_USER: misaldo_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      # Read only by the init script, on the first start with an empty volume.
      MISALDO_APP_PASSWORD: ${MISALDO_APP_PASSWORD:?Set MISALDO_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/dev/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misaldo_admin -d misaldo"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.34
    restart: unless-stopped
    # No volume: the caught emails do not need to survive a restart.
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_DISABLE_POSTFIX: "True"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      # Loaded on the first start: the admin connection, without its password.
      - ./deploy/dev/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  pgadmin-data:
